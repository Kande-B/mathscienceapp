image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r index.html manifest.json sw.js robots.txt sitemap.xml CNAME google*.html public/ 2>/dev/null || true
    - cp -r data ressources assets labo actualites public/ 2>/dev/null || true
    - echo "✅ Maths-Sciences-App déployé avec succès sur La Forge !"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "main"
